version: "2"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/b0r1ssh/go-xls
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - nilerr
    - staticcheck
    - unparam
    - unused
    - prealloc
    - unconvert
    - iface
    - inamedparam
    - errname
